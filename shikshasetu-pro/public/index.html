<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6246d8">
  <meta name="description" content="ShikshaSetu — learn, explore lessons and get study support, even offline.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="brand-logo.png">
  <script>
    (function () {
      var theme = "";
      try { theme = JSON.parse(localStorage.getItem("ss") || "{}").theme || ""; } catch (e) {}
      document.documentElement.dataset.theme = theme === "light" || theme === "dark"
        ? theme
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <title>ShikshaSetu · शिक्षासेतु</title>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <img class="brand-logo" src="brand-logo.png" alt="ShikshaSetu · शिक्षासेतु">
        <small id="sub"></small>
      </div>
      <div class="splash-screen" id="splash-screen" role="status" aria-label="ShikshaSetu is getting ready">
        <div class="splash-frame">
          <img class="splash-artwork" src="shikshasetu-brand.png" alt="ShikshaSetu — शिक्षासेतु">
          <div class="splash-caption">
            <span class="splash-loader" aria-hidden="true"><i></i></span>
            <p>आपकी सीखने की दुनिया तैयार हो रही है…</p>
            <small>Getting your learning space ready…</small>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"></button>
        <button class="mentor-entry" id="mentor-entry" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 10 10-6 10 6-10 6z"/><path d="M6 12.5v5c3.5 2.5 8.5 2.5 12 0v-5M22 10v6"/></svg><span>Mentor</span></button>
        <button class="net" id="net" type="button"></button>
      </div>
    </header>
    <main id="main"></main>
    <nav id="nav" aria-label="Main navigation"></nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
